<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
</head>
<body>
    <h2>{{ menu|join:" | " }}</h2>
    <h1>{{ title }}</h1>
    <ul>
    {% for p in posts %}
    {% if p.is_published %}
        <li><h2>{{ p.title }}</h2>
            <p>{{ p.content }}</p>
        </li>
        {% if not forloop.last %}
        <hr>
        {% endif %}
    {% endif %}
    {% endfor %}
    </ul>
</body>
</html>
